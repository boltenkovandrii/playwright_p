name: Tests

on:
  # Having both 'push' and 'pull_request' is probably excessive but for a sample project it is ok.
  # Commit to existing PR will trigger both events, but the PR event will run on a temporary commit based on main and current branch, so both have value.
  # Runs on current branch
  push:
    branches:
      - main
      - feature/**
  # Runs on temporary commit based on main and current branch - actually testing results after the merge.
  pull_request:
    branches:
      - main
      - feature/**
  workflow_dispatch:
    inputs:
      browsers:
        description: 'Comma or space-separated list of browsers (e.g. firefox,chromium). If empty, defaults applied.'
        required: false
      profiles:
        description: 'Comma or space-separated list of profiles (e.g. desktop,mobile). If empty, defaults applied.'
        required: false
      allure-screenshots:
        description: 'Whether to attach screenshots to Allure report (on/off). If empty, defaults to off.'
        required: false
        type: choice
        options:
          - ''
          - 'on'
          - 'off'

env:
  PRESTASHOP_BASE_URL: http://localhost:8090

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Determine profiles
        id: set-profiles
        run: |
          # Normalize workflow_dispatch input (comma or space separated)
          RAW_INPUT="${{ github.event.inputs.profiles || '' }}"
          # replace commas with spaces and trim
          RAW_INPUT=$(echo "$RAW_INPUT" | tr ',' ' ' | xargs)

          if [ -n "$RAW_INPUT" ]; then
            PROFILES="$RAW_INPUT"
          # getting all profiles from tests.config.profiles.py for PRs and main branch pushes, otherwise default to empty
          elif [ "${{ github.event_name }}" = 'pull_request' ] || { [ "${{ github.event_name }}" = 'push' ] && [ "${{ github.ref }}" = 'refs/heads/main' ]; }; then
            PROFILES=$(python -c "from tests.config.profiles import PROFILES; print(' '.join(PROFILES))")
          else
            PROFILES=""
          fi

          echo "profiles=$PROFILES" >> $GITHUB_OUTPUT

      - name: Determine browsers
        id: set-browsers
        run: |
          # Normalize workflow_dispatch input (comma or space separated)
          RAW_INPUT="${{ github.event.inputs.browsers || '' }}"
          # replace commas with spaces and trim
          RAW_INPUT=$(echo "$RAW_INPUT" | tr ',' ' ' | xargs)
         
          if [ -n "$RAW_INPUT" ]; then
            BROWSERS="$RAW_INPUT"
          elif [ "${{ github.event_name }}" = 'pull_request' ] || { [ "${{ github.event_name }}" = 'push' ] && [ "${{ github.ref }}" = 'refs/heads/main' ]; }; then
            # full set for main
            BROWSERS="firefox chromium webkit"
          else
            # default for feature branches / PRs
            BROWSERS="chromium"
          fi

          echo "browsers=$BROWSERS" >> $GITHUB_OUTPUT

      - name: Determine allure-screenshots
        id: set-allure-screenshots
        run: |
           # Use workflow_dispatch input if provided, otherwise default to off
           ALLURE_SCREENSHOTS="${{ github.event.inputs['allure-screenshots'] || 'off' }}"
           
           # If empty string (from empty option), default to off
           if [ -z "$ALLURE_SCREENSHOTS" ]; then
             ALLURE_SCREENSHOTS="off"
           fi
           
           echo "allure_screenshots=$ALLURE_SCREENSHOTS" >> $GITHUB_OUTPUT

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps
#        run: python -m playwright install --with-deps ${{ steps.set-browsers.outputs.browsers }}  ## providing user input directly to bash is not safe and just installing all the browsers does not consume a lot of resources

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Docker Compose
        run: |
          sudo apt-get update -y
          sudo apt-get install -y docker-compose

      - name: Show runner resources - REMOVE
        run: |
          echo "=== CPU ==="
          nproc
          lscpu | grep -E 'CPU\(s\)|Model name'
      
          echo "=== Memory ==="
          free -h
      
          echo "=== Disk ==="
          df -h
      
          echo "=== Docker ==="
          docker info

      - name: Start app
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          docker-compose -f docker/docker-compose-prestashop.yml up -d

      - name: Show container resources - REMOVE
        run: |
          docker stats --no-stream

      - name: Start resource monitor - REMOVE
        run: |
          mkdir -p reports
      
          (
            while true; do
              echo "===== $(date -Is) ====="
              echo "--- HOST ---"
              uptime
              free -h
              vmstat 1 1
              echo "--- PRESTASHOP ---"
              docker stats --no-stream prestashop-test
              echo
              sleep 5
            done
          ) > reports/resource-monitor.log 2>&1 &
      
          echo $! > /tmp/resource-monitor.pid
          sleep 1
      
          echo "Monitor PID: $(cat /tmp/resource-monitor.pid)"
          echo "Monitor log:"
          cat reports/resource-monitor.log || true        

      - name: Run tests
        env:
          PRESTASHOP_BASE_URL: ${{ github.event.inputs.prestashop_base_url || env.PRESTASHOP_BASE_URL }}
        run: |
          BROWSERS="${{ steps.set-browsers.outputs.browsers }}"
          PROFILES="${{ steps.set-profiles.outputs.profiles }}"
          ALLURE_SCREENSHOTS="${{ steps.set-allure-screenshots.outputs.allure_screenshots }}"
          ARGS=""
          PROFILE_ARGS=""
          for b in $BROWSERS; do
            ARGS="$ARGS --browser $b"
          done
          for profile in $PROFILES; do
            PROFILE_ARGS="$PROFILE_ARGS --profile=$profile"
          done
          echo "Running pytest for browsers: $BROWSERS"
          if [ -n "$PROFILES" ]; then
            echo "Running pytest for profiles: $PROFILES"
          else
            echo "Running pytest with default profile selection"
          fi
          echo "Allure screenshots setting: $ALLURE_SCREENSHOTS"
          pytest $ARGS $PROFILE_ARGS --allure-screenshots=$ALLURE_SCREENSHOTS -n auto --alluredir=reports/allure-results

      - name: Show container resources2 - REMOVE
        if: always()
        run: |
          docker stats --no-stream

      - name: Stop resource monitor - REMOVE
        if: always()
        run: |
          if [ -f /tmp/resource-monitor.pid ]; then
            kill "$(cat /tmp/resource-monitor.pid)" 2>/dev/null || true
          fi
      
          echo "=== Resource monitor ==="
          cat reports/resource-monitor.log || true

      - name: Check container state - REMOVE
        if: always()
        run: |
          docker inspect prestashop-test \
            --format='OOMKilled={{.State.OOMKilled}} RestartCount={{.RestartCount}} ExitCode={{.State.ExitCode}}'

      - name: Upload resource monitor - REMOVE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-monitor
          path: reports/resource-monitor.log
          if-no-files-found: warn


      - name: Install Allure
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          npm install -g allure-commandline

      - name: Generate Allure report
        if: always()
        run: |
          allure generate reports/allure-results --clean -o reports/allure-report

      - name: Upload report and other test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: reports/
          retention-days: 3
